[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/design"
  to = "/.netlify/functions/design"
  status = 200

[[redirects]]
  from = "/api/analytics-proxy"
  to = "/.netlify/functions/analytics-proxy"
  status = 200

[[redirects]]
  from = "/api/warranty-sync"
  to = "/.netlify/functions/warranty-sync"
  status = 200

# ── Don't serve function source code as static files ──
# publish = "." means the whole repo is uploaded, so without this rule
# anyone could download /netlify/functions/*.js and read the server code.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# ── Security headers (all responses) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Long cache for static images & icons ──
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
