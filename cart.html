<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart – A&T Signboard & Printing</title>
  <style>
    :root {
      --brand: #1a3a5c;
      --accent: #e8a020;
      --green: #16a34a;
      --red: #dc2626;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a3a5c 0%, #2563a8 100%);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-wrap img { height: 38px; border-radius: 6px; }
    .logo-wrap h1 { font-size: 1rem; font-weight: 700; line-height: 1.2; }
    .logo-wrap p { font-size: .75rem; opacity: .8; }
    .back-btn {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 13px; font-weight: 500;
      padding: 7px 13px; border-radius: 8px; text-decoration: none;
      transition: background .15s;
    }
    .back-btn:hover { background: rgba(255,255,255,.22); }

    /* ── Main layout ── */
    .container { max-width: 680px; margin: 0 auto; padding: 24px 16px 100px; }

    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; }

    /* ── Cart item card ── */
    .cart-item {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .item-icon {
      width: 44px; height: 44px; border-radius: 8px;
      background: linear-gradient(135deg, #1a3a5c, #2563a8);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .item-body { flex: 1; min-width: 0; }
    .item-name { font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
    .item-desc { font-size: .8rem; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
    .item-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .item-price { font-weight: 700; font-size: 1rem; color: var(--brand); }
    .item-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--text);
      transition: background .15s;
    }
    .qty-btn:hover { background: #e5e7eb; }
    .qty-display {
      min-width: 28px; text-align: center;
      font-weight: 700; font-size: .95rem;
    }
    .remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--red); font-size: 18px; padding: 4px;
      border-radius: 6px; transition: background .15s;
    }
    .remove-btn:hover { background: #fee2e2; }

    /* ── Summary card ── */
    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px;
      margin-top: 20px;
    }
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: .9rem; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row.total { font-size: 1.1rem; font-weight: 700; color: var(--brand); padding-top: 10px; }

    /* ── Checkout button ── */
    .btn-checkout {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: var(--radius); cursor: pointer;
      text-decoration: none; margin-top: 18px;
      box-shadow: 0 4px 12px rgba(22,163,74,.35);
      transition: opacity .15s, transform .1s;
    }
    .btn-checkout:hover { opacity: .92; transform: translateY(-1px); }
    .btn-checkout:active { transform: translateY(0); }

    .btn-clear {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 12px;
      background: none; border: 1.5px solid var(--border);
      color: var(--muted); font-size: .9rem; border-radius: var(--radius);
      cursor: pointer; margin-top: 10px; transition: border-color .15s, color .15s;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 20px;
    }
    .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .empty-state p { color: var(--muted); margin-bottom: 24px; }
    .btn-shop {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--brand); color: #fff;
      padding: 12px 24px; border-radius: var(--radius);
      font-size: .95rem; font-weight: 600; text-decoration: none;
      transition: opacity .15s;
    }
    .btn-shop:hover { opacity: .88; }

    /* ── Note box ── */
    .note-box {
      background: #fffbeb; border: 1px solid #fcd34d;
      border-radius: 8px; padding: 12px 14px;
      font-size: .82rem; color: #92400e; margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="ant-logo.png" alt="A&T Logo" onerror="this.style.display='none'" />
    <div>
      <h1>A&T Signboard</h1>
      <p>Shopping Cart</p>
    </div>
  </div>
  <a href="index.html" class="back-btn">← All Products</a>
</header>

<div class="container">
  <h2>🛒 Your Cart</h2>
  <div id="cart-content"></div>
</div>

<script>
  /* ────────────────────────────────────────────
     Cart utilities (shared with all product pages)
  ──────────────────────────────────────────── */
  function getCart() {
    try { return JSON.parse(localStorage.getItem('antCart') || '[]'); } catch(e) { return []; }
  }
  function saveCart(items) {
    localStorage.setItem('antCart', JSON.stringify(items));
    render();
  }

  function changeQty(id, delta) {
    var items = getCart();
    var item = items.find(function(i){ return i.id === id; });
    if (!item) return;
    item.qty = Math.max(1, item.qty + delta);
    saveCart(items);
  }

  function removeItem(id) {
    var items = getCart().filter(function(i){ return i.id !== id; });
    saveCart(items);
  }

  function clearCart() {
    if (!confirm('Clear all items from cart?')) return;
    localStorage.removeItem('antCart');
    render();
  }

  function pageIcon(page) {
    var icons = {
      'ant-acrylic-order.html': '🪟',
      'ant-foamboard-order.html': '🟦',
      'ant-inkjet-order.html': '🖨️',
      'ant-neon-order.html': '💡',
      'ant-signboard-order-v2.html': '🪧',
      'ant-bomba-signage-order.html': '🚨',
      'ant-display-set-order.html': '🗂️',
    };
    return icons[page] || '📦';
  }

  function buildWhatsAppMessage(items, orderId, trackUrl) {
    var lines = ['Hello A&T Signboard! I would like to order:'];
    var grandTotal = 0;
    items.forEach(function(item, i) {
      lines.push('');
      lines.push((i+1) + '. *' + item.name + '* (x' + item.qty + ')');
      if (item.desc) {
        item.desc.split(', ').forEach(function(d) { lines.push('   • ' + d); });
      }
      var lineTotal = item.price * item.qty;
      lines.push('   Subtotal: RM ' + lineTotal.toFixed(2));
      grandTotal += lineTotal;
    });
    lines.push('');
    lines.push('*Grand Total: RM ' + grandTotal.toFixed(2) + '*');
    if (orderId) {
      lines.push('');
      lines.push('🔖 *Order ID: ' + orderId + '*');
      lines.push('📦 Track order: ' + trackUrl);
    }
    lines.push('');
    lines.push('Please confirm availability and payment details. Thank you!');
    return lines.join('\n');
  }

  // ── Checkout with Firebase ──
  var ORDER_ID_PENDING = null;

  function generateOrderId() {
    var now = new Date();
    var d = now.getFullYear().toString() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0');
    var r = Math.random().toString(36).substr(2, 4).toUpperCase();
    return 'SHOP-' + d + '-' + r;
  }

  function doCheckout() {
    var items = getCart();
    if (!items.length) return;

    var btn = document.getElementById('btn-checkout');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Saving order…'; }

    var orderId  = generateOrderId();
    var trackUrl = 'https://ant-signboard.netlify.app/track.html?id=' + orderId;

    // Compute grand total
    var grandTotal = items.reduce(function(s, i) { return s + i.price * i.qty; }, 0);

    // Detect warranty products
    var warrantyPages = { 'ant-signboard-order-v2.html': 12, 'ant-neon-order.html': 12 };
    var wItems = items.filter(function(i) { return warrantyPages[i.page]; });
    var wMonths = wItems.length > 0 ? Math.max.apply(null, wItems.map(function(i) { return warrantyPages[i.page] || 12; })) : 12;

    var orderDoc = {
      id:         orderId,
      customer:   'E-Shop Customer',
      phone:      '',
      desc:       items.map(function(i) { return i.name + ' ×' + i.qty; }).join(', '),
      eta:        '',
      source:     'eshop',
      products:   items,
      grandTotal: grandTotal,
      warranty: {
        applicable: wItems.length > 0,
        types:      wItems.map(function(i) { return i.page; }),
        months:     wMonths
      },
      steps: {
        proceed:   { status:'pending', completedAt:null, note:'' },
        ironframe: { status:'pending', completedAt:null, note:'' },
        sticker:   { status:'pending', completedAt:null, note:'' },
        cutting:   { status:'pending', completedAt:null, note:'' },
        edging:    { status:'pending', completedAt:null, note:'' },
        painting:  { status:'pending', completedAt:null, note:'' },
        assembly:  { status:'pending', completedAt:null, note:'' }
      },
      createdAt: new Date().toISOString()
    };

    var waMsg = buildWhatsAppMessage(items, orderId, trackUrl);
    var waUrl = 'https://wa.me/60197901150?text=' + encodeURIComponent(waMsg);

    // Try Firebase save; open WhatsApp regardless
    function proceed() {
      // ── EmailJS: notify owner of new order (non-fatal) ──
      try {
        var itemLines = items.map(function(i) {
          return '• ' + i.name + ' x' + i.qty + ' = RM ' + (i.price * i.qty).toFixed(2);
        }).join('\n');
        emailjs.send('Service_A01', 'template_fj72ou4', {
          order_id:    orderId,
          grand_total: grandTotal.toFixed(2),
          order_items: itemLines,
          track_url:   trackUrl,
          order_time:  new Date().toLocaleString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' })
        }).catch(function(e) { console.warn('[EmailJS] send error:', e); });
      } catch(e) { console.warn('[EmailJS] error:', e); }
      window.open(waUrl, '_blank');
      showOrderConfirmation(orderId, trackUrl);
    }

    if (window._fbSaveEshopOrder) {
      window._fbSaveEshopOrder(orderDoc).then(proceed).catch(function(e) {
        console.warn('Firebase save failed (non-fatal):', e);
        proceed();
      });
    } else {
      proceed();
    }
  }

  function showOrderConfirmation(orderId, trackUrl) {
    var el = document.getElementById('cart-content');
    if (!el) return;
    localStorage.removeItem('antCart');
    el.innerHTML = [
      '<div style="text-align:center;padding:2.5rem 1rem">',
      '  <div style="font-size:3rem;margin-bottom:.8rem">🎉</div>',
      '  <h2 style="font-size:1.2rem;margin-bottom:.4rem">Order Sent!</h2>',
      '  <p style="color:#6b7280;font-size:.9rem;margin-bottom:1.5rem">WhatsApp has opened with your order details.<br>A&T will confirm shortly.</p>',
      '  <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:1rem;margin-bottom:1.2rem;text-align:left">',
      '    <div style="font-size:11px;font-weight:600;color:#15803d;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">Your Order ID</div>',
      '    <div style="font-family:monospace;font-size:1.2rem;font-weight:700;color:#0d1f3c;letter-spacing:.06em">' + orderId + '</div>',
      '    <div style="font-size:12px;color:#6b7280;margin-top:6px">Keep this to track your order progress</div>',
      '  </div>',
      '  <a href="' + trackUrl + '" style="display:block;background:#0d1f3c;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.9rem;margin-bottom:.8rem">',
      '    📦 Track My Order',
      '  </a>',
      '  <a href="index.html" style="display:block;color:#6b7280;font-size:.85rem;margin-top:.4rem">← Back to shop</a>',
      '</div>'
    ].join('');
  }

  function render() {
    var items = getCart();
    var el = document.getElementById('cart-content');

    if (items.length === 0) {
      el.innerHTML = [
        '<div class="empty-state">',
        '  <div class="icon">🛒</div>',
        '  <h3>Your cart is empty</h3>',
        '  <p>Go back and configure a product to add it here.</p>',
        '  <a href="index.html" class="btn-shop">← Browse Products</a>',
        '</div>'
      ].join('');
      return;
    }

    var grandTotal = 0;
    var itemsHTML = items.map(function(item) {
      var lineTotal = item.price * item.qty;
      grandTotal += lineTotal;
      return [
        '<div class="cart-item">',
        '  <div class="item-icon">' + pageIcon(item.page) + '</div>',
        '  <div class="item-body">',
        '    <div class="item-name">' + escHtml(item.name) + '</div>',
        '    <div class="item-desc">' + escHtml(item.desc || '') + '</div>',
        '    <div class="item-footer">',
        '      <div class="item-price">RM ' + lineTotal.toFixed(2) + '</div>',
        '      <div class="item-controls">',
        '        <button class="qty-btn" onclick="changeQty(\'' + item.id + '\',-1)">−</button>',
        '        <span class="qty-display">' + item.qty + '</span>',
        '        <button class="qty-btn" onclick="changeQty(\'' + item.id + '\',1)">+</button>',
        '        <button class="remove-btn" onclick="removeItem(\'' + item.id + '\')" title="Remove">🗑</button>',
        '      </div>',
        '    </div>',
        '  </div>',
        '</div>'
      ].join('');
    }).join('');

    var summaryHTML = [
      '<div class="summary-card">',
      '  <div class="summary-row"><span>' + items.length + ' item(s)</span><span></span></div>',
    ];
    items.forEach(function(item) {
      summaryHTML.push(
        '<div class="summary-row"><span>' + escHtml(item.name) + ' ×' + item.qty + '</span>' +
        '<span>RM ' + (item.price * item.qty).toFixed(2) + '</span></div>'
      );
    });
    summaryHTML.push('<div class="summary-row total"><span>Grand Total</span><span>RM ' + grandTotal.toFixed(2) + '</span></div>');
    summaryHTML.push('</div>');

    var checkoutHTML = [
      '<button id="btn-checkout" class="btn-checkout" onclick="doCheckout()">',
      '  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
      '  Send Order via WhatsApp',
      '</button>',
      '<button class="btn-clear" onclick="clearCart()">🗑 Clear Cart</button>',
      '<div class="note-box">',
      '  ⚠️ WhatsApp order is <strong>not confirmed</strong> until A&T replies with a confirmation. Pricing is estimated — final price depends on artwork and production details.',
      '</div>'
    ].join('');

    el.innerHTML = itemsHTML + summaryHTML.join('') + checkoutHTML;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('Hx5zC7ceOGI-5G4ON');</script>

<!-- Firebase: save e-shop orders -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD787ofMHEFjr6D_W1PsMjBV2SPP7qycX4",
  authDomain: "sign-track-ff7f3.firebaseapp.com",
  projectId: "sign-track-ff7f3",
  storageBucket: "sign-track-ff7f3.firebasestorage.app",
  messagingSenderId: "63683429806",
  appId: "1:63683429806:web:6c75bfaf4f851157bc743f"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window._fbSaveEshopOrder = async function(orderDoc) {
  await setDoc(doc(db, 'orders', orderDoc.id), orderDoc);
};
</script>
</body>
</html>
